<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BC_STOCK</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <div class="header-inner">
      <h1>BC_STOCK</h1>
      <p class="subtitle">기술적 분석 · 펀더멘털 분석 · Claude AI 종합 추천</p>
    </div>
  </header>

  <main>
    <!-- Search -->
    <section class="search-section card">
      <div class="search-row">
        <select id="marketSelect">
          <option value="US">🇺🇸 미국 (US)</option>
          <option value="KR">🇰🇷 한국 (KR)</option>
        </select>
        <div class="input-wrap">
          <input type="text" id="tickerInput" placeholder="종목명 또는 티커 (예: Apple, AAPL, 삼성)" autocomplete="off" />
          <div id="searchDropdown" class="search-dropdown hidden"></div>
        </div>
        <button onclick="analyzeStock()">분석하기</button>
      </div>
      <div class="quick-picks">
        <span class="quick-label">빠른 선택:</span>
        <button class="chip" onclick="quickPick('US','AAPL')">AAPL</button>
        <button class="chip" onclick="quickPick('US','NVDA')">NVDA</button>
        <button class="chip" onclick="quickPick('US','TSLA')">TSLA</button>
        <button class="chip" onclick="quickPick('KR','005930')">삼성전자</button>
        <button class="chip" onclick="quickPick('KR','000660')">SK하이닉스</button>
        <button class="chip" onclick="quickPick('KR','035420')">NAVER</button>
      </div>
    </section>

    <!-- 장 전 브리핑 -->
    <section id="briefingCard" class="card briefing-card hidden">
      <h2>📰 오늘의 시장 브리핑</h2>
      <div id="briefingContent"></div>
    </section>

    <!-- TOP10 섹션 -->
    <section class="card top10-section">
      <div class="top10-header">
        <div>
          <h2>🏆 1~3개월 상승 예상 추천 종목</h2>
          <p class="top10-desc">기술적·펀더멘털·모멘텀 종합 분석 기반 · 매 3시간 갱신</p>
        </div>
        <button class="refresh-btn" onclick="loadTop10(true)" id="refreshBtn">↻ 새로고침</button>
      </div>

      <div id="top10Loading" class="top10-loading">
        <div class="spinner"></div>
        <div>
          <p>국내 종목 분석 중...</p>
          <p class="loading-sub">한국 주요 종목 점수 산출 중 (최대 2분 소요)</p>
        </div>
      </div>

      <div id="top10Content" class="hidden">
        <div class="top10-grid">
          <!-- KR -->
          <div class="top10-col">
            <div class="top10-col-header">
              <span class="flag">🇰🇷</span> 국내 TOP 10
            </div>
            <div id="krList" class="top10-list"></div>
          </div>
          <!-- US -->
          <div class="top10-col">
            <div class="top10-col-header">
              <span class="flag">🇺🇸</span> 해외 TOP 10 <span id="usComingSoon" class="coming-soon">준비 중</span>
            </div>
            <div id="usList" class="top10-list"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Loading -->
    <div id="loading" class="loading-overlay hidden">
      <div class="spinner"></div>
      <p>종목 분석 중...</p>
    </div>

    <!-- Error -->
    <div id="error" class="hidden error-box"></div>

    <!-- Result -->
    <div id="result" class="hidden">
      <section class="card overview-card">
        <div class="overview-left">
          <div class="stock-name" id="stockName"></div>
          <div class="stock-ticker" id="stockTicker"></div>
          <div class="stock-price" id="stockPrice"></div>
          <div class="price-changes" id="priceChanges"></div>
        </div>
        <div class="overview-right">
          <div class="score-ring-wrap">
            <canvas id="scoreGauge" width="160" height="160"></canvas>
            <div class="score-label">
              <span id="scoreValue"></span>
              <small>종합점수</small>
            </div>
          </div>
        </div>
      </section>

      <section class="card ai-card">
        <h2>🤖 AI 추천</h2>
        <div class="ai-content">
          <div class="rec-badge" id="recBadge"></div>
          <div class="ai-summary" id="aiSummary"></div>
          <div class="ai-reasoning" id="aiReasoning"></div>
          <div class="ai-meta" id="aiMeta"></div>
          <div class="ai-lists" id="aiLists"></div>
        </div>
      </section>

      <div class="two-col">
        <section class="card">
          <h2>📊 기술적 분석 <span class="score-chip" id="techScore"></span></h2>
          <div id="techSignals" class="signals-list"></div>
        </section>
        <section class="card">
          <h2>📋 펀더멘털 분석 <span class="score-chip" id="fundScore"></span></h2>
          <div id="fundSignals" class="signals-list"></div>
          <div id="fundMetrics" class="metrics-grid"></div>
        </section>
      </div>

      <section class="card chart-section">
        <div class="chart-tabs">
          <button class="tab-btn active" onclick="showChart('price', this)">가격 차트</button>
          <button class="tab-btn" onclick="showChart('rsi', this)">RSI</button>
          <button class="tab-btn" onclick="showChart('macd', this)">MACD</button>
          <button class="tab-btn" onclick="showChart('volume', this)">거래량</button>
        </div>
        <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
      </section>

      <section class="card">
        <h2>📐 기술적 지표</h2>
        <div class="indicators-grid" id="indicatorsGrid"></div>
      </section>
    </div>
  </main>

  <footer>
    <p>⚠️ 투자 참고용이며, 투자 결정에 대한 책임은 본인에게 있습니다.</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
